# nginx reverse proxy for the voxa backend — TLS termination + WebSocket (Socket.IO) upgrade.
# Copy to /etc/nginx/sites-available/voxa, edit api.YOURHOST + cert paths, then:
#   ln -s /etc/nginx/sites-available/voxa /etc/nginx/sites-enabled/voxa
#   nginx -t && systemctl reload nginx
# TLS certs: `certbot --nginx -d api.YOURHOST` (Let's Encrypt) manages the 443 block + renewal.
#
# The backend serves BOTH the REST API and the Socket.IO realtime gateway on the same port
# (8080), so this single upstream must forward WebSocket upgrades. The app is stateless and
# fan-out is cluster-wide via the Redis adapter, so NO sticky sessions are required — list all
# replicas here (or point at an internal LB) and nginx will round-robin.

upstream voxa_backend {
    server 127.0.0.1:8080;
    # server 10.0.0.11:8080;   # add replicas here (least_conn optional)
    keepalive 32;
}

# Redirect all plaintext to HTTPS (except the ACME challenge certbot uses for renewal).
server {
    listen 80;
    listen [::]:80;
    server_name api.YOURHOST;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.YOURHOST;

    # --- TLS (certbot fills these in; keep them out of git) ---
    ssl_certificate     /etc/letsencrypt/live/api.YOURHOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.YOURHOST/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    server_tokens off;

    # Media uploads go DIRECT to Cloudflare R2 (presigned PUT), never through this proxy, so the
    # request body cap can stay small — it only bounds JSON API payloads.
    client_max_body_size 2m;

    # Real client IP for the app's rate-limiter and logs (the app sets trustProxy=true).
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header Host              $host;
    # Preserve/forward a request id for cross-tier tracing (the app honours x-request-id).
    proxy_set_header X-Request-Id      $request_id;

    # WebSocket upgrade for Socket.IO (must be on the socket path).
    location /socket.io/ {
        proxy_pass http://voxa_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  3600s;   # long-lived sockets: don't cut idle connections
        proxy_send_timeout  3600s;
    }

    # Health probes (unauthenticated by design) — handy for external uptime checks too.
    location = /health       { proxy_pass http://voxa_backend; }
    location = /health/ready { proxy_pass http://voxa_backend; }

    # REST API.
    location / {
        proxy_pass http://voxa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }
}
