name: voxa
description: voxa social-audio client (original build from recovered requirements spec).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  crypto: ^3.0.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  socket_io_client: ^2.0.3   # realtime — MUST match the backend Socket.IO gateway
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  agora_rtc_engine: ^6.3.2      # voice — uses YOUR Agora app id
  permission_handler: ^11.3.1   # runtime mic permission (required for capture on Android 6+)
  svgaplayer_flutter: ^2.2.0    # renders the restored original .svga gift/room/effect assets (owned)

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/room/
    - assets/roomEmoji/
    # Recovered original H5 room-ecosystem assets (owned) — see ROOM_ASSET_MAPPING.md
    - assets/room_ext/pk/
    - assets/room_ext/party/
    - assets/room_ext/vip/
    - assets/room_ext/cp/
    - assets/room_ext/wealth/
    # Restored original SVGA animation assets (owned), by feature
    - assets/anim/svga/bomb/
    - assets/anim/svga/cp/
    - assets/anim/svga/dj/
    - assets/anim/svga/dynamic/
    - assets/anim/svga/friend/
    - assets/anim/svga/gift/
    - assets/anim/svga/guide/
    - assets/anim/svga/home/
    - assets/anim/svga/hosttag/
    - assets/anim/svga/kroom/
    - assets/anim/svga/live/
    - assets/anim/svga/login/
    - assets/anim/svga/medal/
    - assets/anim/svga/rocket/
    - assets/anim/svga/userspace/
    - assets/anim/svga/yinbo/
    # Restored original PAG assets (owned), by feature
    - assets/anim/pag/bomb/
    - assets/anim/pag/cp/
    - assets/anim/pag/gift/
    - assets/anim/pag/home/
    - assets/anim/pag/kroom/
    - assets/anim/pag/loading/
    - assets/anim/pag/lucky/
    - assets/anim/pag/main/
    - assets/anim/pag/rank/
    - assets/anim/pag/topbanner/
    - assets/anim/pag/userspace/
    - assets/anim/pag/yinbo/
