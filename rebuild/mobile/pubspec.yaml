name: voxa
description: voxa social-audio client (original build from recovered requirements spec).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  crypto: ^3.0.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  socket_io_client: ^2.0.3   # realtime — MUST match the backend Socket.IO gateway
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  agora_rtc_engine: ^6.3.2      # voice — uses YOUR Agora app id
  permission_handler: ^11.3.1   # runtime mic permission (required for capture on Android 6+)
  svgaplayer_flutter: ^2.2.0    # renders the restored original .svga gift/room/effect assets (owned)
  pag:                          # Tencent libpag (com.tencent.tav:libpag) — the engine the ORIGINAL app
    path: third_party/pag       # used for .pag effects (org.libpag in the decompiled APK). VENDORED &
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  image_picker: ^1.2.1
  google_sign_in: ^6.2.2        # Google Sign-In — native account chooser → ID token → /v1/auth/google
                                # patched: upstream 1.0.7 references Flutter's removed v1 embedding and
                                # pre-AGP-8 build config. See third_party/pag + PAG_RUNTIME_RECOVERY_REPORT.md

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/images/nav/
    - assets/images/profile/
    - assets/images/room/seats/
    - assets/room/
    # Flutter's directory declaration is NOT recursive, so each emoji folder needs its own line —
    # without these six files were bundled-but-unreachable at runtime.
    - assets/roomEmoji/
    - assets/roomEmoji/face_11/
    - assets/roomEmoji/face_58/
    - assets/roomEmoji/face_59/
    # Recovered original H5 room-ecosystem assets (owned) — see ROOM_ASSET_MAPPING.md
    - assets/room_ext/pk/
    - assets/room_ext/party/
    - assets/room_ext/vip/
    - assets/room_ext/cp/
    - assets/room_ext/wealth/
    # Restored original SVGA animation assets (owned), by feature
    - assets/anim/svga/bomb/
    - assets/anim/svga/cp/
    - assets/anim/svga/dj/
    - assets/anim/svga/dynamic/
    - assets/anim/svga/friend/
    - assets/anim/svga/gift/
    - assets/anim/svga/guide/
    - assets/anim/svga/home/
    - assets/anim/svga/hosttag/
    - assets/anim/svga/kroom/
    - assets/anim/svga/live/
    - assets/anim/svga/login/
    - assets/anim/svga/medal/
    - assets/anim/svga/rocket/
    - assets/anim/svga/userspace/
    - assets/anim/svga/yinbo/
    # Salvaged from the original app's on-device cache (owned) — see assets/anim/salvaged/README.md
    - assets/anim/salvaged/
    # R2.2 — recovered H5 corpus from act.zaffalive.com (owned). Content-hash named in the
    # original, so these are classified by DOMAIN via the page that loaded them; see
    # lib/core/assets/asset_registry_h5.g.dart.
    - assets/h5/anchor/
    - assets/h5/coinsMerchant/
    - assets/h5/cpReward/
    - assets/h5/friendCenter/
    - assets/h5/luckyBox/
    - assets/h5/magicBox/
    - assets/h5/medalRank/
    - assets/h5/pkReward/
    - assets/h5/pkRule/
    - assets/h5/roomParty/
    - assets/h5/roomScoreRank/
    - assets/h5/vipScoreRank/
    - assets/h5/wealth_grade/
    # Restored original PAG assets (owned), by feature
    - assets/anim/pag/bomb/
    - assets/anim/pag/cp/
    - assets/anim/pag/gift/
    - assets/anim/pag/home/
    - assets/anim/pag/kroom/
    - assets/anim/pag/loading/
    - assets/anim/pag/lucky/
    - assets/anim/pag/main/
    - assets/anim/pag/rank/
    - assets/anim/pag/topbanner/
    - assets/anim/pag/userspace/
    - assets/anim/pag/yinbo/
