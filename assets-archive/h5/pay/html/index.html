<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
		<meta name="format-detection" content="telephone=no">
		<title>購買讚</title>
		<link rel="stylesheet" type="text/css" href="./css/base.css">
		<link rel="stylesheet" type="text/css" href="./css/index.css">
		<script type="text/javascript" src="./js/font.js"></script>
	</head>
	<body>
		<div id="app">
			<div id="main">
				<div class="container">
					<ul class="payList">
					</ul>
				</div>
			</div>
			<div class="bottom">
				<p>金幣:<span></span> <a href="javascript:;">充值</a></p>
			</div>
			<div class="promptBox">
				<p></p>
				<div class="ok">
			    <a href="javascript:;">確定</a>
			  </div>
			</div>
			<div class="mask" style="display: none"></div>
			<div class="loading">
				<img src="./img/loading.gif" alt="">
			</div>
			<div class="maskBox">
				<i class="promask"></i>
				<div class="buy">
					<p>確定消費<span class="pay"></span>金幣購買<span class="like"></span>個讚</p>
					<a href="javascript:void(0)" class="leftBtn">取消</a>
					<a href="javascript:void(0)" class="rightBtn">確定</a>
				</div>
				<div class="buy_success">
					<p>購買成功</p>
					<a href="javascript:void(0)">我知道了</a>
				</div>
				<div class="unpay">
					<p>餘額不足</p>
					<a href="javascript:void(0)">前往充值</a>
				</div>
			</div>
		</div>
		<script type="text/javascript" src="./js/jquery-2.1.3.min.js"></script>
		<!-- <script type="text/javascript" src="./js/template-web.js"></script>-->
    <script type="text/javascript" src="./js/index.js?v=2.0"></script> 
	</body>
</html>
